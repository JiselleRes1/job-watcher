<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Job Watcher</title>
<meta name="description" content="What changed in the latest daily run.">
<meta name="theme-color" content="#1f6f54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Today</h1>
  <p class="sub" id="last-run">Loading…</p>
  <div class="stats" id="stats"></div>
  <div class="cols">
    <section class="card"><h2>New postings</h2><p class="muted">First seen in the latest run (postings already open when watching began are left out).</p><ul class="plain" id="new"></ul></section>
    <section class="card"><h2>Removed postings</h2><p class="muted">No longer listed by their source in the latest run.</p><ul class="plain" id="removed"></ul></section>
  </div>
  <section class="card"><h2>Sources</h2><table><thead><tr><th>Source</th><th>Status</th><th>Postings</th></tr></thead><tbody id="sources"></tbody></table></section>
</main>
<script src="app.js"></script>
<script src="today.js"></script>
</body>
</html>
