name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests httpx
      - name: Probe from Python
        run: |
          python - <<'PY'
          import json, time, urllib.request, requests, httpx
          U="https://tysonfoods.wd5.myworkdayjobs.com/wday/cxs/tysonfoods/TSN/jobs"
          B={"limit":20,"offset":0,"searchText":""}
          H={"User-Agent":"job-watcher/1.0 (student project; daily job board reader)"}
          def show(name, f):
              try: print(name, f())
              except Exception as e: print(name, "ERR", str(e)[:120])
          show("requests", lambda: requests.post(U, json=B, headers=H, timeout=30).status_code)
          show("requests default UA", lambda: requests.post(U, json=B, timeout=30).status_code)
          def ul():
              r=urllib.request.Request(U, data=json.dumps(B).encode(), headers={**H,"Content-Type":"application/json"})
              return urllib.request.urlopen(r, timeout=30).status
          show("urllib", ul)
          show("httpx", lambda: httpx.post(U, json=B, headers=H, timeout=30).status_code)
          # volume test: 40 pages in a row with requests
          codes=[]
          for i in range(40):
              B2=dict(B, offset=20*i)
              try: codes.append(requests.post(U, json=B2, headers=H, timeout=30).status_code)
              except Exception as e: codes.append("E")
              time.sleep(0.2)
          print("40 pages requests:", codes)
          PY
