name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Workday
        run: |
          U=https://tysonfoods.wd5.myworkdayjobs.com/wday/cxs/tysonfoods/TSN/jobs
          B='{"limit":20,"offset":0,"searchText":""}'
          echo "runner ip: $(curl -s https://api.ipify.org)"
          t() { echo "== $1"; shift; curl -s -o /tmp/o -D /tmp/h -w "code=%{http_code}\n" "$@"; head -c 300 /tmp/o; echo; grep -i "retry-after\|server:\|x-" /tmp/h | head -5; }
          t "plain curl" -X POST -H 'Content-Type: application/json' -d "$B" $U
          t "honest UA" -A "job-watcher/1.0 (student project; daily job board reader)" -X POST -H 'Content-Type: application/json' -d "$B" $U
          t "honest UA + accept" -A "Mozilla/5.0 (compatible; job-watcher/1.0; +https://github.com/JiselleRes1/job-watcher)" -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -H 'Accept-Language: en-US' -d "$B" $U
          sleep 20
          t "after 20s, plain" -X POST -H 'Content-Type: application/json' -d "$B" $U
          t "other tenant (clorox)" -X POST -H 'Content-Type: application/json' -d "$B" https://clorox.wd1.myworkdayjobs.com/wday/cxs/clorox/Clorox/jobs
